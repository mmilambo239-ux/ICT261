plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

application {
    mainModule = 'com.customermanager'
    mainClass = 'com.customermanager.CustomerMain'
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml']
}